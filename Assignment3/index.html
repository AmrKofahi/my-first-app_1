<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مواعيد اللقاءات</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container">
    <header class="page-header">
      <h1 class="page-title">مواعيد اللقاءات</h1>
      <p class="page-desc">تابع لقاءاتك القادمة واستعد للتطبيق.</p>
    </header>

    <article class="card card-blue">
      <span class="badge">اللقاء القادم</span>
      <h2 class="card-title">أساسيات HTML</h2>
      <p class="card-desc">رتّب محتوى الصفحة واستخدم العناصر المناسبة.</p>
      <p class="card-time">السبت - 10:00 صباحًا</p>
      <a class="btn" href="#">تفاصيل اللقاء</a>
    </article>

    <article class="card card-green">
      <span class="badge">الأسبوع القادم</span>
      <h2 class="card-title">تنسيق الصفحات باستخدام CSS</h2>
      <p class="card-desc">ننسّق النصوص والألوان ونضبط المسافات.</p>
      <p class="card-time">الاثنين - 5:00 مساءً</p>
      <a class="btn" href="#">تفاصيل اللقاء</a>
    </article>
  </main>
</body>
</html>
